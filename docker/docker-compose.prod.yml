services:
  postgres:
    image: postgres:16-alpine
    container_name: codeforge_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codeforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeforge_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-codeforge}
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-codeforge} -d $${POSTGRES_DB:-codeforge}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: codeforge_prod_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: codeforge_prod_migrator
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeforge}:${POSTGRES_PASSWORD:-codeforge_secure_pass}@postgres:5432/${POSTGRES_DB:-codeforge}
      JWT_SECRET: ${JWT_SECRET:-production-secret-key-must-be-changed-32bytes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    command: alembic upgrade head
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: codeforge_prod_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeforge}:${POSTGRES_PASSWORD:-codeforge_secure_pass}@postgres:5432/${POSTGRES_DB:-codeforge}
      JWT_SECRET: ${JWT_SECRET:-production-secret-key-must-be-changed-32bytes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.worker
    container_name: codeforge_prod_worker
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codeforge}:${POSTGRES_PASSWORD:-codeforge_secure_pass}@postgres:5432/${POSTGRES_DB:-codeforge}
      JWT_SECRET: ${JWT_SECRET:-production-secret-key-must-be-changed-32bytes}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully

volumes:
  postgres_prod_data:
